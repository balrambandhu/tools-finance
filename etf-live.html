<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETF Live — QQQ · SPY · GLD</title>
<!--
  ETF LIVE — single-file dashboard (QQQ / SPY / GLD)
  =================================================
  Deploy to GitHub Pages:
    1. Create a repo (e.g. "etf-live"), upload this file as index.html
       (rename it to index.html) at the repo root.
    2. Repo Settings → Pages → Deploy from branch → main / root → Save.
    3. Open https://<you>.github.io/etf-live/ — done. No build step.

  Any static host works the same way (Netlify Drop, Cloudflare Pages,
  Vercel, plain web space): upload this one file and serve it.

  Data: Yahoo Finance chart API (no key) for daily history + live price,
  Quotes are delayed ~15 min; extended-hours
  prices appear when published.
  Economic-event dates are embedded below (ECON_EVENTS) — update them from
  the BLS / Federal Reserve schedules when they roll forward.
-->
<style>
  :root{
    --bg:#f4f6f8; --surface:#ffffff; --text:#111827; --muted:#6b7280;
    --border:#e3e7ec; --up:#16a34a; --down:#dc2626;
    --up-bg:rgba(22,163,74,.14); --down-bg:rgba(220,38,38,.14);
    --econ:#8b5cf6; --econ-label:#7c3aed; --accent:#3b82f6; --warn:#d97706;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0f14; --surface:#141b25; --text:#e9eef5; --muted:#98a4b3;
      --border:#26313e; --econ-label:#a78bfa;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:0 12px 32px;
  }
  .wrap{max-width:680px;margin:0 auto}
  header.top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:12px; padding:14px 2px 10px;
  }
  header.top h1{font-size:20px;margin:0 0 4px;font-weight:800}
  #status{font-size:12px;color:var(--muted)}
  #status .st-updating{font-weight:800;color:var(--warn)}
  #status .st-retry{font-weight:800;color:var(--down)}
  #status .st-ok{font-weight:700;color:var(--up)}
  #status .seg{white-space:nowrap}
  @media (max-width:560px){
    header.top{flex-direction:column;align-items:stretch}
    .refresh-ctl{text-align:left;margin-top:10px}
  }
  .refresh-ctl{
    text-align:right; font-size:12px; color:var(--muted); white-space:nowrap;
  }
  .refresh-ctl input{
    width:56px; padding:4px 6px; font-size:13px; border-radius:6px;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
  }
  .refresh-ctl button{
    padding:4px 10px; font-size:12px; border-radius:6px; cursor:pointer;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    margin-left:4px;
  }
  .refresh-ctl button:hover{border-color:var(--accent)}
  #countdown{margin-top:4px;min-height:14px}
  #err{
    display:none; background:var(--down-bg); color:var(--down);
    border:1px solid var(--down); border-radius:8px; padding:8px 12px;
    font-size:13px; margin:0 0 12px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:18px; margin-bottom:16px;
  }
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
  .ticker{font-size:20px;font-weight:800}
  .ticker a{text-decoration:underline}
  .fname{font-size:13px;color:var(--muted)}
  .price{text-align:right}
  .big{font-size:24px;font-weight:800}
  .tag{
    font-size:10px;font-weight:700;color:var(--muted);vertical-align:middle;
    margin-left:6px;letter-spacing:1px;
  }
  .pill{
    display:inline-block;margin-top:4px;padding:4px 12px;border-radius:999px;
    font-size:13px;font-weight:700;
  }
  .pill.up{color:var(--up);background:var(--up-bg)}
  .pill.down{color:var(--down);background:var(--down-bg)}
  .pill.small{font-size:11px;padding:2px 8px;margin-top:0}
  .subline{font-size:12px;color:var(--muted);margin-top:6px}
  table.stats{width:100%;border-collapse:collapse;font-size:14px}
  table.stats td{color:var(--muted)}
  table.stats td:last-child{text-align:right;font-weight:600}
  .upcoming{font-size:12px;color:var(--muted);margin:2px 0 8px}
  .upcoming b{color:var(--econ-label)}
  footer{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
  .spin{display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>ETF Live</h1>
      <div id="status"><span class="st-updating">Starting…</span></div>
    </div>
    <div class="refresh-ctl">
      <label>Refresh every
        <input id="refreshSec" type="number" min="5" max="3600" step="1" value="30">
        sec
      </label>
      <button id="applyRefresh" type="button">Apply</button>
      <div id="countdown"></div>
    </div>
  </header>
  <div id="err"></div>
  <main id="cards"></main>
  <section id="upcoming"></section>
  <footer>
    Quotes &amp; daily history: Yahoo Finance (delayed ~15 min, no API key).<br>
    Extended-hours prices appear when published. Charts: daily closes;
    the live price is appended as today's point while the market is open.
  </footer>
</div>
<script>
"use strict";
/* ============================== config ============================== */
const SYMBOLS = [
  {sym:"QQQ", name:"Invesco QQQ Trust",    color:"#3b82f6"},
  {sym:"SPY", name:"SPDR S&P 500 ETF Trust",color:"#10b981"},
  {sym:"GLD", name:"SPDR Gold Shares",      color:"#d97706"},
];
// Yahoo Finance v8 chart API: daily history + live price in one call,
// CORS-friendly (Access-Control-Allow-Origin: *).
const yahooChartURL = s =>
  `https://query1.finance.yahoo.com/v8/finance/chart/${s}?range=6mo&interval=1d`;
// NYSE holidays (sessions labelled "Market closed"); extend as needed.
const NYSE_HOLIDAYS = new Set([
  "2026-01-01","2026-01-19","2026-02-16","2026-04-03","2026-05-25",
  "2026-06-19","2026-07-03","2026-09-07","2026-11-26","2026-12-25",
  "2027-01-01","2027-01-18","2027-02-15","2027-04-02","2027-05-31",
  "2027-06-18","2027-07-05","2027-09-06","2027-11-25","2027-12-24",
]);
// Economic-release dates (BLS / Federal Reserve schedules). Update as they roll.
const ECON_EVENTS = [
  {date:"2026-08-07",label:"NFP", note:"July jobs report"},
  {date:"2026-08-12",label:"CPI", note:"July CPI"},
  {date:"2026-08-13",label:"PPI", note:"July PPI"},
  {date:"2026-09-04",label:"NFP", note:"August jobs report"},
  {date:"2026-09-10",label:"PPI", note:"August PPI"},
  {date:"2026-09-11",label:"CPI", note:"August CPI"},
  {date:"2026-09-16",label:"FOMC",note:"FOMC decision + SEP"},
  {date:"2026-10-02",label:"NFP", note:"September jobs report"},
  {date:"2026-10-14",label:"CPI", note:"September CPI"},
  {date:"2026-10-15",label:"PPI", note:"September PPI"},
  {date:"2026-10-28",label:"FOMC",note:"FOMC decision"},
  {date:"2026-11-06",label:"NFP", note:"October jobs report"},
  {date:"2026-11-10",label:"CPI", note:"October CPI"},
  {date:"2026-11-13",label:"PPI", note:"October PPI"},
  {date:"2026-12-04",label:"NFP", note:"November jobs report"},
  {date:"2026-12-09",label:"FOMC",note:"FOMC decision + SEP"},
  {date:"2026-12-10",label:"CPI", note:"November CPI"},
  {date:"2026-12-15",label:"PPI", note:"November PPI"},
];
const ECON_COLOR = "#8b5cf6";

/* ============================== time ============================== */
function etParts(d){
  d = d || new Date();
  const parts = new Intl.DateTimeFormat("en-CA",{
    timeZone:"America/New_York", hourCycle:"h23",
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit",weekday:"short",
  }).formatToParts(d);
  const o = {};
  for(const x of parts) o[x.type] = x.value;
  return o;
}
function etDateStr(d){ const p = etParts(d); return `${p.year}-${p.month}-${p.day}`; }
function etDateFromEpoch(ts){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",
    year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(ts*1000));
}
function addDays(ds, n){
  const [y,m,dd] = ds.split("-").map(Number);
  const d = new Date(Date.UTC(y, m-1, dd + n));
  return d.toISOString().slice(0,10);
}
function marketSession(){
  const p = etParts();
  const ds = `${p.year}-${p.month}-${p.day}`;
  if(p.weekday==="Sat" || p.weekday==="Sun" || NYSE_HOLIDAYS.has(ds))
    return {key:"closed", label:"Market closed"};
  const mins = (+p.hour)*60 + (+p.minute);
  if(mins >=  4*60 && mins <  9*60+30) return {key:"pre",  label:"Pre-Mkt"};
  if(mins >=  9*60+30 && mins < 16*60) return {key:"open", label:"Market open"};
  if(mins >= 16*60 && mins < 20*60)    return {key:"post", label:"Aft-Hrs"};
  return {key:"closed", label:"Market closed"};
}
function etClock(){
  const p = etParts();
  let h = +p.hour; const ap = h>=12 ? "PM" : "AM"; h = h%12 || 12;
  return `<span class="seg">${p.weekday} ${p.month}/${p.day}</span> · <span class="seg">${h}:${p.minute} ${ap} ET</span>`;
}

/* ============================== fetch ============================== */
async function fetchText(url){
  try{
    const r = await fetch(url, {cache:"no-store"});
    const t = await r.text();
    if(!r.ok || !t.trim()) throw new Error("empty");
    return t;
  }catch(e){
    // fallback: public CORS proxy, then give up with a visible error
    const r2 = await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(url),
                           {cache:"no-store"});
    const t2 = await r2.text();
    if(!r2.ok || !t2.trim()) throw new Error("data fetch failed");
    return t2;
  }
}
const yahooCache = {}; // sym -> {data, at, day}
async function yahooSymbol(sym, today){
  const c = yahooCache[sym];
  if(c && c.day===today && Date.now()-c.at < 10*60*1000) return c.data;
  const j = JSON.parse(await fetchText(yahooChartURL(sym)));
  const r = j && j.chart && j.chart.result && j.chart.result[0];
  if(!r || !r.timestamp || !r.indicators || !r.indicators.quote)
    throw new Error("bad Yahoo response");
  const closes = r.indicators.quote[0].close || [];
  const bars = [];
  for(let i=0;i<r.timestamp.length;i++){
    const cl = closes[i];
    if(cl==null || !isFinite(cl)) continue;
    bars.push({date: etDateFromEpoch(r.timestamp[i]), close: cl});
  }
  const meta = r.meta || {};
  const data = {
    bars,
    live: isFinite(meta.regularMarketPrice) ? meta.regularMarketPrice : null,
    liveDate: meta.regularMarketTime ? etDateFromEpoch(meta.regularMarketTime) : null,
  };
  yahooCache[sym] = {data, at:Date.now(), day:today};
  return data;
}

/* ============================== formatting ============================== */
const fmt2 = v => Math.abs(v).toLocaleString("en-US",
  {minimumFractionDigits:2, maximumFractionDigits:2});
const sgn = v => v>=0 ? "+" : "\u2212";
const money = v => "$"+fmt2(v);
const smoney = v => sgn(v)+money(v);
const spct = v => sgn(v)+Math.abs(v).toFixed(2)+"%";
function pill(change, pct, small){
  const up = change>=0;
  return `<span class="pill ${up?"up":"down"}${small?" small":""}">`+
    `${smoney(change)} (${spct(pct)})</span>`;
}
/* ============================== charts ==============================
   JS port of the ETF alert chart builder: same geometry, paddings, label
   collision handling, and econ-event markers. */
const CH = {W:560, H:196, PADL:64, PADR:32, PADT:44, PADB:36,
            BLEED:[-14,-12,28,20]};
function niceTicks(lo, hi, n){
  n = n || 4;
  const span = hi-lo, step = span/(n-1);
  const mag = step>=1 ? Math.pow(10, String(Math.floor(step)).length-1) : 1;
  let s = 10*mag;
  for(const m of [1,2,2.5,5,10]){ if(step/mag <= m){ s = m*mag; break; } }
  const ticks = [];
  for(let t = Math.floor(lo/s)*s; t <= hi + s*0.01 && ticks.length<8; t += s){
    if(t >= lo - s*0.01) ticks.push(t);
  }
  return ticks.filter(t => t >= lo - span*0.05 && t <= hi + span*0.05).slice(0,5);
}
function chartSVG(data, color, gid, ariaLabel, events){
  const {W,H,PADL,PADR,PADT,PADB} = CH;
  const vals = data.map(d=>d[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi-lo)*0.08 || 1; lo -= pad; hi += pad;
  const n = data.length;
  const X = i => PADL + i*(W-PADL-PADR)/(n-1);
  const Y = v => PADT + (hi-v)*(H-PADT-PADB)/(hi-lo);
  const pts = data.map((d,i)=>[X(i), Y(d[1])]);
  const line = "M " + pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" L ");
  const area = `${line} L ${pts[n-1][0].toFixed(1)},${H-PADB} `+
               `L ${pts[0][0].toFixed(1)},${H-PADB} Z`;
  let grid = "";
  for(const t of niceTicks(Math.min(...vals), Math.max(...vals))){
    const yy = Y(t);
    grid += `<line x1="${PADL}" y1="${yy.toFixed(1)}" x2="${W-PADR}" y2="${yy.toFixed(1)}" `+
            `stroke="var(--border)" stroke-width="1"/>`+
            `<text x="${PADL-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" `+
            `fill="var(--muted)" font-family="sans-serif">${+t.toPrecision(6)}</text>`;
  }
  // x labels: ~6 ticks, always including the final date
  let idxs = [];
  const k = Math.max(1, Math.floor(n/6));
  for(let i=0;i<n;i+=k) idxs.push(i);
  if(idxs[idxs.length-1] !== n-1){
    if((n-1) - idxs[idxs.length-1] >= 3) idxs.push(n-1);
    else idxs[idxs.length-1] = n-1;
  }
  idxs = idxs.filter((ii,pos,arr)=>pos===0 || ii-arr[pos-1] >= 3);
  let xlabels = "";
  for(const i of idxs){
    const dt = data[i][0].slice(5).replace("-","/");
    xlabels += `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" `+
               `font-size="11" fill="var(--muted)" font-family="sans-serif">${dt}</text>`;
  }
  // ---- label placement with collision handling ----
  const placed = [];
  const labelBox = (lx,ly,txt,fs,anchor)=>{
    const w = txt.length*fs*0.62 + 6;
    const y0 = ly - fs*0.85, y1 = ly + fs*0.3;
    return anchor==="middle" ? [lx-w/2,y0,lx+w/2,y1] : [lx-w,y0,lx,y1];
  };
  const collides = (b, slack)=>{
    slack = slack===undefined?4:slack;
    return placed.some(p => !(b[2]+slack < p[0] || p[2]+slack < b[0] ||
                              b[3]+slack < p[1] || p[3]+slack < b[1]));
  };
  const clampCX = (xx,txt,fs)=>{
    const half = txt.length*fs*0.31 + 4;
    return Math.min(Math.max(xx,half), W-half);
  };
  const textSVG = (lx,ly,txt,fs,fill,anchor)=>
    `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" `+
    `text-anchor="${anchor==="middle"?"middle":"end"}" font-size="${fs}" `+
    `font-weight="700" fill="${fill}" font-family="sans-serif">${txt}</text>`;
  const place = (txt,fs,cands,fill)=>{
    for(const [lx,ly,anchor] of cands){
      const b = labelBox(lx,ly,txt,fs,anchor);
      if(!collides(b)){ placed.push(b); return textSVG(lx,ly,txt,fs,fill,anchor); }
    }
    const [lx,ly,anchor] = cands[0];
    placed.push(labelBox(lx,ly,txt,fs,anchor));
    return textSVG(lx,ly,txt,fs,fill,anchor);
  };
  // econ events: only the latest of each type inside this window, on 1M chart
  let ev = "";
  if(events && events.length){
    const dates = data.map(d=>d[0]);
    const d0 = dates[0], d1 = dates[dates.length-1];
    const snap = ed => {
      if(dates.includes(ed)) return dates.indexOf(ed);
      const eo = Date.parse(ed+"T00:00:00Z");
      let best=0, bd=Infinity;
      dates.forEach((dd,i)=>{
        const df = Math.abs(Date.parse(dd+"T00:00:00Z")-eo);
        if(df<bd){bd=df;best=i;}
      });
      return best;
    };
    const latest = {};
    for(const e of events){
      if(e.date>=d0 && e.date<=d1 &&
         (!latest[e.label] || e.date>latest[e.label].date)) latest[e.label]=e;
    }
    const hits = Object.values(latest).map(e=>[snap(e.date),e.label])
                                       .sort((a,b)=>a[0]-b[0]);
    let prevX=null, lvl=0;
    for(const [i,label] of hits){
      const xx = X(i);
      if(prevX!==null && Math.abs(xx-prevX)<44) lvl = 1-lvl; else lvl = 0;
      prevX = xx;
      const lx = clampCX(xx,label,10);
      let ly=20;
      for(const cand of (lvl===0?[20,36]:[36,20])){
        if(!collides(labelBox(lx,cand,label,10,"middle"))){ ly=cand; break; }
      }
      placed.push(labelBox(lx,ly,label,10,"middle"));
      ev += `<line x1="${xx.toFixed(1)}" y1="${PADT}" x2="${xx.toFixed(1)}" y2="${H-PADB}" `+
            `stroke="${ECON_COLOR}" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.65"/>`+
            `<text x="${lx.toFixed(1)}" y="${ly}" text-anchor="middle" font-size="10" `+
            `font-weight="700" fill="var(--econ-label)" paint-order="stroke" `+
            `stroke="var(--surface)" stroke-width="3" font-family="sans-serif">${label}</text>`;
    }
  }
  const imax = vals.indexOf(Math.max(...vals));
  const imin = vals.indexOf(Math.min(...vals));
  const [ex,ey] = pts[n-1];
  const endTxt = money(vals[n-1]);
  const endSVG = place(endTxt,12,
    [[ex-8,ey-10,"end"],[ex-8,ey+26,"end"],[ex-70,ey-10,"end"],[ex-70,ey+26,"end"]],
    "var(--text)");
  const hiTxt = "High "+money(Math.max(...vals));
  const hx = clampCX(X(imax),hiTxt,11);
  const hiSVG = place(hiTxt,11,
    [[hx,Y(Math.max(...vals))-12,"middle"],[hx,Y(Math.max(...vals))+26,"middle"]], color);
  const loTxt = "Low "+money(Math.min(...vals));
  const lx = clampCX(X(imin),loTxt,11);
  const loSVG = place(loTxt,11,
    [[lx,Y(Math.min(...vals))+20,"middle"],[lx,Y(Math.min(...vals))-14,"middle"]], color);
  let marks = "";
  if(imax!==n-1) marks += `<circle cx="${X(imax).toFixed(1)}" cy="${Y(Math.max(...vals)).toFixed(1)}" r="4.5" fill="${color}"/>`;
  if(imin!==n-1 && imin!==imax) marks += `<circle cx="${X(imin).toFixed(1)}" cy="${Y(Math.min(...vals)).toFixed(1)}" r="4.5" fill="${color}"/>`;
  marks += hiSVG + loSVG;
  const end = `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="5" `+
              `fill="${color}" stroke="var(--surface)" stroke-width="2"/>${endSVG}`;
  const [bx,by,bw,bh] = CH.BLEED;
  return `<svg viewBox="${bx} ${by} ${W+bw} ${H+bh}" `+
         `style="width:100%;height:auto;display:block" role="img" aria-label="${ariaLabel}">`+
         `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">`+
         `<stop offset="0" stop-color="${color}" stop-opacity="0.30"/>`+
         `<stop offset="1" stop-color="${color}" stop-opacity="0.02"/>`+
         `</linearGradient></defs>${grid}${ev}`+
         `<path d="${area}" fill="url(#${gid})"/>`+
         `<path d="${line}" fill="none" stroke="${color}" stroke-width="3" `+
         `stroke-linejoin="round" stroke-linecap="round"/>`+
         `${marks}${xlabels}${end}</svg>`;
}
/* ============================== cards ============================== */
function yahooURL(sym){ return `https://finance.yahoo.com/quote/${sym}`; }
function cardHTML(def, st){
  const {sym,name,color} = def;
  const {price, chg, pct, tag, subPrice, subChg, subPct} = st;
  let priceHTML;
  const tagHTML = tag ? `<span class="tag">${tag}</span>` : "";
  if(subPrice !== undefined){
    priceHTML =
      `<div class="big">${money(price)}${tagHTML}</div>`+
      `${pill(chg,pct)}`+
      `<div class="subline">Regular close ${money(subPrice)} ${pill(subChg,subPct,true)}</div>`;
  }else if(st.prevCloseLine !== undefined){
    priceHTML =
      `<div class="big">${money(price)}${tagHTML}</div>`+
      `${pill(chg,pct)}`+
      `<div class="subline">Prev close ${money(st.prevCloseLine)}</div>`;
  }else{
    priceHTML = `<div class="big">${money(price)}${tagHTML}</div>${pill(chg,pct)}`;
  }
  let blocks = "";
  st.charts.forEach((ch,j)=>{
    blocks += chartSVG(ch.data, color, `g-${sym.toLowerCase()}-${j}`,
                       `${sym} ${ch.period} chart`, j===0 ? ECON_EVENTS : []);
    if(j < st.charts.length-1) blocks += `<div style="height:6px;"></div>`;
  });
  let rows = "";
  st.charts.forEach((ch,i)=>{
    const vals = ch.data.map(d=>d[1]);
    const c = vals[vals.length-1]-vals[0], p = c/vals[0]*100;
    const border = i===0 ? "border-top:1px solid var(--border);" : "";
    const pad = i===0 ? "padding:8px 2px 0;" : "padding:0 2px 8px;";
    const fg = c>=0 ? "var(--up)" : "var(--down)";
    rows += `<tr><td style="${pad}${border}">${ch.period} change</td>`+
            `<td style="${pad}${border}color:${fg};">${smoney(c)} (${spct(p)})</td></tr>`;
  });
  return `<div class="card">`+
    `<div class="card-head"><div><div class="ticker">`+
    `<a href="${yahooURL(sym)}" style="color:${color}">${sym}</a></div>`+
    `<div class="fname">${name}</div></div>`+
    `<div class="price">${priceHTML}</div></div>`+
    `${blocks}`+
    `<table class="stats">${rows}</table></div>`;
}
/* Per-symbol state from daily bars + live quote + session. */
function symbolState(def, bars, quote, sess, today){
  const todayBar = bars.find(b=>b.date===today) || null;
  // completed bars: in post/closed sessions today's bar (if present) is final
  const doneToday = todayBar && (sess.key==="post"||sess.key==="closed");
  const comp = doneToday ? bars : bars.filter(b=>b.date!==today);
  const lastC = comp[comp.length-1], prevC = comp[comp.length-2];
  const live = (quote && quote.date===today) ? quote.price : null;
  const mkData = n => {
    let data = comp.slice(-n).map(b=>[b.date,b.close]);
    if(live!==null && sess.key!=="closed"){
      const last = data[data.length-1];
      if(!(last[0]===today && last[1]===live)) data.push([today, live]);
    }
    return data;
  };
  const d1 = mkData(21), d3 = mkData(63);
  let s;
  if(sess.key==="open"){
    const price = live!==null ? live : lastC.close;
    s = {price, chg:price-lastC.close, pct:(price-lastC.close)/lastC.close*100};
  }else if(sess.key==="pre"){
    if(live!==null && live!==lastC.close){
      s = {price:live, chg:live-lastC.close, pct:(live-lastC.close)/lastC.close*100,
           tag:"Pre-Mkt", prevCloseLine:lastC.close};
    }else{
      const c = lastC.close-prevC.close;
      s = {price:lastC.close, chg:c, pct:c/prevC.close*100, tag:"Pre-Mkt"};
    }
  }else if(sess.key==="post"){
    if(live!==null && live!==lastC.close){
      const tot = live-prevC.close, rc = lastC.close-prevC.close;
      s = {price:live, chg:tot, pct:tot/prevC.close*100, tag:"Aft-Hrs",
           subPrice:lastC.close, subChg:rc, subPct:rc/prevC.close*100};
    }else{
      const c = lastC.close-prevC.close;
      s = {price:lastC.close, chg:c, pct:c/prevC.close*100, tag:"Aft-Hrs"};
    }
  }else{ // closed
    const c = lastC.close-prevC.close;
    s = {price:lastC.close, chg:c, pct:c/prevC.close*100, tag:"Closed"};
  }
  s.charts = [{period:"1M",data:d1},{period:"3M",data:d3}];
  return s;
}
function upcomingHTML(allData){
  let ref = "0000-00-00";
  for(const arr of allData) for(const [d] of arr) if(d>ref) ref=d;
  const refY = ref.slice(0,4);
  const items = [];
  for(const lab of ["CPI","PPI"]){
    const cand = ECON_EVENTS.filter(e=>e.label===lab && e.date>ref)
                            .sort((a,b)=>a.date<b.date?-1:1)[0];
    if(!cand) continue;
    const [y,m,dd] = cand.date.split("-").map(Number);
    const dt = new Date(Date.UTC(y,m-1,dd));
    const ds = dt.toLocaleDateString("en-US",
      {weekday:"short",month:"short",day:"numeric",timeZone:"UTC"}) +
      (String(y)!==refY ? ", "+y : "");
    items.push(`${cand.note} \u2014 ${ds}`);
  }
  if(!items.length) return "";
  return `<div class="upcoming"><b>Upcoming:</b><br>${items.join("<br>")}</div>`;
}

/* ============================== refresh loop ============================== */
const $ = id => document.getElementById(id);
let refreshSec = Math.min(3600, Math.max(5,
  parseInt(localStorage.getItem("etfLiveRefreshSec")||"30",10)||30));
let timer=null, cdTimer=null, nextAt=0, lastGood=null;
function setStatus(t){ $("status").innerHTML = t; }
function showErr(msg){
  const e = $("err");
  if(msg){ e.style.display="block"; e.textContent = msg; }
  else e.style.display="none";
}
async function refresh(){
  const sess = marketSession(), today = etDateStr();
  setStatus(`<span class="st-updating"><span class="spin">\u25cc</span> <span class="seg">Updating</span> · ${etClock()} · <span class="seg">${sess.label}…</span></span>`);
  const states = [];
  const allData = [];
  const sources = new Set(), errs = [];
  for(const def of SYMBOLS){
    let bars = null, quote = null;
    try{
      const y = await yahooSymbol(def.sym, today);
      bars = y.bars;
      if(y.live!==null && y.liveDate) quote = {date:y.liveDate, price:y.live};
      sources.add("Yahoo");
    }catch(e){ errs.push(`Yahoo ${def.sym}: ${e.message}`); }
    if(!bars || bars.length < 5)
      throw new Error(`not enough history for ${def.sym} (${errs.join("; ")})`);
    const st = symbolState(def, bars, quote, sess, today);
    states.push([def,st]);
    st.charts.forEach(c=>allData.push(c.data));
  }
  $("cards").innerHTML = states.map(([d,s])=>cardHTML(d,s)).join("");
  $("upcoming").innerHTML = upcomingHTML(allData);
  lastGood = new Date();
  showErr("");
  const via = [...sources].join("+");
  setStatus(`<span class="st-ok"><span class="seg">ETF update</span> · ${etClock()} · <span class="seg">${sess.label}</span> · <span class="seg">via ${via}</span></span>`);
}
async function tick(){
  try{ await refresh(); }
  catch(e){
    console.warn(e);
    showErr(`Couldn't reach market data (${e.message}). `+
            (lastGood ? "Showing last good update. " : "") + "Retrying…");
    if(lastGood) setStatus(`<span class="st-retry"><span class="seg">ETF update</span> · <span class="seg">last good ${lastGood.toLocaleTimeString()}</span> · <span class="seg">retrying</span></span>`);
    else setStatus(`<span class="st-retry">Waiting for market data…</span>`);
  }
  schedule();
}
function schedule(){
  clearInterval(timer); clearInterval(cdTimer);
  nextAt = Date.now() + refreshSec*1000;
  timer = setTimeout(tick, refreshSec*1000);
  const cd = ()=>{
    const s = Math.max(0, Math.ceil((nextAt-Date.now())/1000));
    $("countdown").textContent = `next refresh in ${s}s · every ${refreshSec}s`;
  };
  cd(); cdTimer = setInterval(cd, 500);
}
function applyInterval(fromInput){
  let v = parseInt($("refreshSec").value,10);
  if(!isFinite(v)) v = refreshSec;
  v = Math.min(3600, Math.max(5, v));
  $("refreshSec").value = v;
  refreshSec = v;
  localStorage.setItem("etfLiveRefreshSec", String(v));
  if(fromInput) schedule();
}
$("applyRefresh").addEventListener("click", ()=>applyInterval(true));
$("refreshSec").addEventListener("keydown", e=>{
  if(e.key==="Enter") applyInterval(true);
});
// init
$("refreshSec").value = refreshSec;
tick();
</script>
